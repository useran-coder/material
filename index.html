<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원자재 사용현황</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23d71920'/%3E%3Ctext x='32' y='42' font-size='26' font-family='Arial' font-weight='700' fill='%23fff' text-anchor='middle'%3EDB%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#16284a;--muted:#64748b;--line:#e2e8f0;--line2:#cbd5e1;--accent:#2563eb;--accent-soft:#eff6ff;--navy:#1e3a5f;
  --ok:#0f766e;--warn:#b45309;--bad:#dc2626;--shadow:0 10px 30px rgba(15,23,42,.10)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;font-size:14px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
input,select{border:1px solid var(--line2);border-radius:8px;background:#fff;padding:7px 10px}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}

/* 머리글 */
header.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 24px 10px 68px;min-height:62px}
.brand{display:flex;flex-direction:column;line-height:1.15;flex:0 0 auto}
.brand h1{margin:0;font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.2px}
.brand small{font-size:11.5px;color:var(--muted);font-weight:600}
/* v7 월별 추이 그래프 (매입분석도구 추이 그래프와 같은 모양) */
.ptrend{margin:0 0 12px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(20,40,74,.05);overflow:hidden}
.ptrend .pt-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 13px;border-bottom:1px solid #eef2f7;background:#fbfcfe}
.ptrend .pt-title{font-size:12.5px;font-weight:800;color:#16284a;white-space:nowrap}
.ptrend .pt-years{display:inline-flex;gap:4px}
.ptrend .pt-year{border:1px solid #d7dfea;background:#fff;color:#5b6b82;border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:800;font-family:inherit;cursor:pointer;line-height:1.5}
.ptrend .pt-year:hover{border-color:#2f7ef0;color:#2f7ef0}
.ptrend .pt-year.on{background:#16284a;border-color:#16284a;color:#fff}
.ptrend .pt-units{display:inline-flex;border:1px solid #d7dfea;border-radius:999px;overflow:hidden;margin-left:2px}
.ptrend .pt-unit{border:0;background:#fff;color:#5b6b82;padding:3px 11px;font-size:11.5px;font-weight:800;font-family:inherit;cursor:pointer;line-height:1.5}
.ptrend .pt-unit+.pt-unit{border-left:1px solid #e6ecf4}
.ptrend .pt-unit:hover{color:#2f7ef0}
.ptrend .pt-unit.on{background:#0d9488;color:#fff}
.ptrend .pt-stats{margin-left:auto;font-size:11.5px;color:#7b8798;font-weight:600;white-space:nowrap}
.ptrend .pt-stats b{color:#16284a}
.ptrend .pt-stats b.r{color:#ef4444}
.ptrend .pt-stats b.g{color:#0d9488}
.ptrend .pt-stats b.y{color:#a16207}
.ptrend .pt-svg{padding:4px 6px 0}
.ptrend .pt-pu{padding:7px 13px 9px;font-size:11.5px;color:#7b8798;border-top:1px solid #eef2f7;background:#fffaf5}
.ptrend .pt-pu b{color:#c2410c}
.ptrend .pt-pu a{color:#2563eb;font-weight:700}
.ptrend-empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
#srchWrap{flex:1 1 auto;display:flex;justify-content:center;min-width:0}
#srch{display:flex;align-items:center;width:min(560px,100%);height:38px;border:1px solid var(--line2);border-radius:10px;background:#fff;overflow:hidden}
#srch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
#srch input{flex:1;border:0;box-shadow:none;height:100%;padding:0 12px;min-width:0}
#srch button{border:0;background:transparent;height:100%;padding:0 12px;color:var(--muted);font-size:15px}
#srch button:hover{color:var(--accent)}
.hdr-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
#syncChip{font-size:12px;white-space:nowrap;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#f8fafc;color:var(--muted);cursor:pointer}
#syncChip.ok{color:var(--ok);border-color:#99f6e4;background:#f0fdfa}
#syncChip.busy{color:var(--accent);border-color:#bfdbfe;background:var(--accent-soft)}
#syncChip.err{color:var(--bad);border-color:#fecaca;background:#fef2f2}
#auChip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap;padding:4px 6px 4px 10px;border:1px solid var(--line);border-radius:999px}
#auChip small{color:var(--ok);background:#f0fdfa;border:1px solid #99f6e4;border-radius:999px;padding:1px 7px;font-weight:700}
#auChip button{border:1px solid #fecaca;background:#fef2f2;color:var(--bad);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700}

main{max-width:1680px;margin:0 auto;padding:18px 24px 60px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.bar .lab{font-size:12.5px;font-weight:800;color:var(--navy);margin-right:2px}
.bar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;color:#334155}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.bar input[type=date]{padding:5px 8px;font-size:12.5px}
#srchWrap{align-items:center;gap:10px}
#qInfo{display:flex;align-items:center;gap:6px;flex:0 0 auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
#qInfo:empty{display:none}
#qInfo b{color:var(--accent)}
#qClear{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:700}
.kpi .v{font-size:20px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:700;margin-left:2px}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
.kpi[data-go]{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.kpi[data-go]:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.10)}
.kpi[data-go].on{border-color:var(--accent);background:var(--accent-soft)}
.kpi[data-go] .k::after{content:' ›';color:var(--accent)}

.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:800;color:#334155}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs .opt{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12.5px}

.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card .note{padding:9px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);background:#f8fafc;line-height:1.6}
.card .note b{color:var(--ink)}
.tw{overflow:auto;max-height:calc(100vh - 330px);min-height:240px}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid #eef2f7;font-size:13px;vertical-align:middle}
th{position:sticky;top:0;z-index:2;background:#f1f5f9;color:#334155;font-size:12px;font-weight:800;text-align:left;white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--line2)}
th.num{text-align:right}
th .ar{font-size:10px;color:var(--accent);margin-left:3px}
tbody tr.g{cursor:pointer}
tbody tr.g:hover td{background:#f8fbff}
tbody tr.g.open td{background:#eff6ff}
tr.tot td{position:sticky;bottom:0;background:#f8fafc;font-weight:800;border-top:1px solid var(--line2)}
td.mat b{color:var(--navy)}
.gr{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:800;background:#f1f5f9;color:#334155;margin-right:6px}
.gr.EGI{background:#dbeafe;color:#1d4ed8}.gr.PO{background:#fde68a;color:#92400e}.gr.STS{background:#e2e8f0;color:#334155}.gr.GA{background:#dcfce7;color:#166534}.gr.HGI{background:#ede9fe;color:#5b21b6}.gr.CR{background:#fee2e2;color:#991b1b}
.mchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 8px 1px 3px;font-size:11.5px;margin:1px 4px 1px 0;white-space:nowrap;cursor:pointer;background:#fff}
.mchip:hover{border-color:var(--accent)}
.mchip .gr{margin:0;min-width:0;padding:0 5px;font-size:10.5px}
td.sub{padding:0;background:#fbfdff}
.subbox{padding:8px 12px 12px 34px;border-bottom:2px solid #dbeafe}
.subbox table th{position:static;background:#eef2f7;font-size:11.5px;cursor:default}
.subbox table td{font-size:12.5px;padding:5px 9px}
.subbox .h{font-size:12px;font-weight:800;color:var(--navy);margin:2px 0 6px}
a.lk{color:var(--accent);font-weight:700;text-decoration:none;cursor:pointer}
a.lk:hover{text-decoration:underline}
.warnTag{display:inline-block;font-size:10.5px;font-weight:800;color:var(--warn);background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:0 5px;margin-left:4px}
.more{display:block;margin:10px auto;border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 16px;font-weight:700;font-size:12.5px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.heat{position:relative}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#1e3a5f;color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700;box-shadow:0 10px 30px rgba(15,23,42,.3);transition:all .25s;z-index:999}
#toast.on{opacity:1;transform:translateX(-50%)}
#matGate{position:fixed;inset:0;z-index:99980;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#f8fafc;color:#1e3a5f;transition:opacity .3s}
#matGate.out{opacity:0;pointer-events:none}
#matGate .mgCi{display:block;width:132px;height:132px;margin:0 auto 18px;object-fit:contain}
#matGate .mgPct{font-size:54px;line-height:1;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#matGate .mgPct span{font-size:30px}
#matGate .mgBar{height:9px;width:260px;margin:16px auto 0;background:#e2e8f0;border-radius:6px;overflow:hidden}
#matGate .mgBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1e3a5f,#3b82f6);border-radius:6px;transition:width .25s ease}
#matGate .mgMsg{margin-top:11px;font-size:13px;font-weight:700;color:#64748b}
#matGate .mgSteps{margin-top:14px;font-size:12px;color:#94a3b8;line-height:1.8;text-align:left}
#matGate .mgSteps b{color:#0f766e}
@media (max-width:640px){#matGate .mgCi{width:102px;height:102px}}
#loading{padding:80px 20px;text-align:center;color:var(--muted);font-size:14px}
#loading .spin{width:34px;height:34px;border-radius:50%;border:3px solid #dbeafe;border-top-color:var(--accent);margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#errBox{display:none;margin:0 0 12px;padding:12px 14px;border:1px solid #fecaca;background:#fef2f2;color:#991b1b;border-radius:12px;font-size:13px;line-height:1.6}
#errBox code{background:#fff;border:1px solid #fecaca;border-radius:5px;padding:0 5px}

/* 로그인 */
html:not(.au-in) body>*:not(#auGate){visibility:hidden!important}
#auGate{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;visibility:visible!important}
#auForm{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 24px 20px}
#auForm .au-h{text-align:center;margin-bottom:16px}
#auForm .au-t{font-size:18px;font-weight:800}
#auForm .au-s{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
#auForm .au-l{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 0 4px}
#auForm .au-i{width:100%;padding:10px 11px;border-radius:10px;font-size:14px}
#auForm .au-c{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;font-weight:600;cursor:pointer}
#auForm .au-c span{color:var(--muted);font-weight:500}
#auForm .au-b{width:100%;margin-top:14px;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:800}
#auForm .au-b:disabled{opacity:.6}
#auForm .au-m{margin-top:10px;font-size:11.5px;font-weight:600;white-space:pre-line;text-align:center;min-height:14px}
#auForm .au-srv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
#auForm .au-srv-t,#auForm .au-b2{width:100%;padding:7px;border:1px solid var(--line);background:transparent;border-radius:9px;font-size:11.5px;font-weight:700}
#auForm .au-f{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:11px;color:var(--muted);line-height:1.6}
.au-kl{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.au-kl a{flex:1;text-align:center;padding:7px 8px;border:1px solid var(--accent);border-radius:8px;color:var(--accent);font-weight:700;text-decoration:none;font-size:12.5px}

@media(max-width:980px){
  header.top{flex-wrap:wrap;padding:10px 14px 10px 60px}
  #srchWrap{order:5;flex-basis:100%}
  main{padding:14px 12px 50px}
  .tw{max-height:none}
  #syncChip{display:none}
}
@media print{header.top,.bar,.tabs,#toast{display:none!important}.tw{max-height:none;overflow:visible}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>원자재 사용현황</h1><small>(주)동방파스텍 · 생산일지 «원자재 사용현황» 시트 연동</small></div>
  <div id="srchWrap"><form id="srch" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="원자재(EGI 1.6 61) · 품번 · 품명 · 규격 · Lot" aria-label="검색">
    <button type="submit" title="검색">🔍</button>
  </form><span id="qInfo"></span></div>
  <div class="hdr-right">
    <span id="syncChip" title="누르면 지금 시트를 다시 확인합니다">연결 전</span>
    <span id="auChip"></span>
  </div>
</header>

<main>
  <div id="errBox"></div>
  <div id="loading"><div class="spin"></div>시트 자료를 불러오는 중…</div>
  <div id="app" hidden>
    <div class="bar" id="fbar"></div>
    <div class="kpis" id="kpis"></div>
    <div class="tabs" id="tabs"></div>
    <div class="card" id="view"></div>
  </div>
</main>
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   원자재 사용현황 v1 (2026-11-17)
   - 자료: «2026 생산일지» › «원자재 사용현황» 시트 (매출분석 로그인 서버 rawuse.gs 가 읽어 줌)
   - 로그인: 매출분석도구·가공비 견적기와 같은 계정·같은 저장 이름(dpt_auth_*)
   - 시트를 고치면 1분 안에 자동 반영 (창으로 돌아올 때도 바로 확인)
   ═══════════════════════════════════════════════════════════ */
var MAT_VER='v12';
var AU_URL_DEFAULT='https://script.google.com/macros/s/AKfycbxSlND4ZKOpxISNQMRdV2d-LA5YxXS1BDe0k2TXKq6g7Tfm6PZ1Rse3mp0Nm4ndZXZdiQ/exec';
var AU_KEY_DEFAULT='';   /* 비밀키는 공개 저장소에 넣지 않음 — 같은 브라우저의 매출분석·견적기 설정에서 찾거나 처음 한 번 입력 */
var AU_ROLE={admin:'관리자',uploader:'업로더',user:'일반'};
var AU={token:'',id:'',name:'',role:'',exp:0};
var POLL_MS=60000, CACHE_KEY='ruCacheV1', UI_KEY='ruUiV1';

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ───── 로그인 (가공비 견적기·코일 조합과 같은 방식) ───── */
function auUrl(){try{return String(localStorage.getItem('dpt_auth_url')||AU_URL_DEFAULT).trim();}catch(e){return AU_URL_DEFAULT;}}
function auKey(){try{return String(localStorage.getItem('dpt_auth_key')||localStorage.getItem('dpt_sync_key')||AU_KEY_DEFAULT).trim();}catch(e){return AU_KEY_DEFAULT;}}
function auDiscoverKey(){
  return new Promise(function(res){
    if(auKey())return res(true);
    try{
      var rq=indexedDB.open('dbpastec_sales'), made=false;
      rq.onupgradeneeded=function(){made=true;try{rq.transaction.abort();}catch(e){}};
      rq.onerror=function(){res(false);}; rq.onblocked=function(){res(false);};
      rq.onsuccess=function(){var db=rq.result; if(made||!db.objectStoreNames.contains('kv')){db.close();return res(false);}
        try{var g=db.transaction('kv','readonly').objectStore('kv').get('settings');
          g.onsuccess=function(){db.close();var st=g.result,k=st&&st.gsync&&String(st.gsync.key||'').trim(),u=st&&st.gsync&&String(st.gsync.url||'').trim();
            if(k){try{localStorage.setItem('dpt_auth_key',k);if(u&&!localStorage.getItem('dpt_auth_url'))localStorage.setItem('dpt_auth_url',u);}catch(e){}res(true);}else res(false);};
          g.onerror=function(){db.close();res(false);};
        }catch(e){db.close();res(false);}};
    }catch(e){res(false);}
    setTimeout(function(){res(!!auKey());},2000);
  });
}
function auValid(){return !!(AU.token&&AU.exp&&Date.now()<AU.exp);}
function auMask(s){try{s=String(s||'');var k='dbps@2026#au',o='';for(var i=0;i<s.length;i++)o+=String.fromCharCode(s.charCodeAt(i)^k.charCodeAt(i%k.length));return btoa(unescape(encodeURIComponent(o)));}catch(e){return '';}}
function auUnmask(s){try{var t=decodeURIComponent(escape(atob(String(s||'')))),k='dbps@2026#au',o='';for(var i=0;i<t.length;i++)o+=String.fromCharCode(t.charCodeAt(i)^k.charCodeAt(i%k.length));return o;}catch(e){return '';}}
function auRestore(){var v=lsGet('dpt_auth_v1');if(v&&typeof v==='object')AU=Object.assign(AU,v);}
function auPersist(keep){lsSet('dpt_auth_v1',keep===false?null:{token:AU.token,id:AU.id,name:AU.name,role:AU.role,exp:AU.exp});}
async function auCall(payload,timeoutMs,_try,url){
  try{return await auCall0(payload,timeoutMs,url);}catch(e){if(e.retry&&(_try||0)<2){await new Promise(function(r){setTimeout(r,e.retryMs||1500);});return auCall(payload,timeoutMs,(_try||0)+1,url);}throw e;}
}
async function ruCall(payload,timeoutMs){
  var u=ruUrl();
  try{ return await auCall(Object.assign({},payload),timeoutMs,0,u); }
  catch(e){

var Data=(function(){
  var timer=0, busy=false, lastTry=0, lastOk=0, err='';
  function chip(cls,txt,title){var c=$('syncChip'); c.className=cls||''; c.textContent=txt; c.title=(title||'')+'\n누르면 지금 시트를 다시 확인합니다.';}
  function hm(t){var d=new Date(t);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
  function showErr(e){

    if(/ruGet|알 수 없는|Unknown action|지원하지 않는|unsupported/i.test(m)||/action/i.test(m)&&!/로그인/.test(m))

        +'<br>→ 앱스스크립트에서 ① rawuse 파일이 있는지 ② Code.gs 의 doGet·doPost 에 <code>ruRoute_</code> 줄이 있는지 확인한 뒤 «배포 관리 → 연필 → 버전: 새 버전 → 배포»를 해 주세요. 배포가 여러 개면 위 주소의 배포를 고쳐야 합니다.';
    box.innerHTML='⚠ 시트 자료를 받지 못했습니다: '+m+(DB.rows.length?'<br>마지막으로 받은 자료('+esc(DB.at?new Date(DB.at).toLocaleString('ko-KR'):'')+')를 보여 주는 중입니다.':''); box.style.display='block';
    if(!DB.rows.length){$('loading').style.display='none';}

  async function pull(manual){
    if(busy||!auValid())return; busy=true; lastTry=Date.now();
    chip('busy','시트 확인 중…','');
    try{
      var d=await ruCall({action:'ruGet',rev:DB.rows.length?DB.rev:''},90000);

      else{
        var had=DB.rows.length, oldRev=DB.rev;
        var rows=buildRows(d.head||[],d.rows||[]);
        DB={rows:rows,rev:d.rev,at:d.at,n:d.n,sheet:d.sheet,title:d.title,url:d.url,head:d.head,raw:d.rows};
        lsSet(CACHE_KEY,{rev:d.rev,at:d.at,n:d.n,sheet:d.sheet,title:d.title,url:d.url,head:d.head,rows:d.rows,uid:AU.id});
        render();
        if(had&&oldRev&&oldRev!==d.rev)toast('시트가 수정되어 새 내용으로 바꿨습니다 · '+hm(lastOk));
      }
      chip('ok','✓ 시트 반영 '+hm(lastOk)+' · '+N(DB.rows.length)+'줄','«'+(DB.title||'')+' › '+(DB.sheet||'')+'» 1분마다 자동 확인');
    }catch(e){
      err=e.message||String(e);
      if(e.auth){ auLogout(); return; }
      chip('err','⚠ 시트 연결 실패','오류: '+err); showErr(e);
    }finally{busy=false; if(!window.__matFirstPull)window.__matFirstPull={ok:!err,at:Date.now()};}
  }
  function start(){
    stop();
    var c=lsGet(CACHE_KEY);
    window.__matCacheChecked=1;
    if(c&&c.rows&&c.head&&c.uid===AU.id){ try{ window.__matCacheHit=1; DB={rows:buildRows(c.head,c.rows),rev:c.rev,at:c.at,n:c.n,sheet:c.sheet,title:c.title,url:c.url}; render(); chip('busy','저장본 표시 · 시트 확인 중…',''); }catch(e){} }
    pull();
    timer=setInterval(function(){ if(document.visibilityState==='visible')pull(); },POLL_MS);
  }
  function stop(){ clearInterval(timer); timer=0; }
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&auValid()&&Date.now()-lastTry>15000)pull(); });
  $('syncChip').onclick=function(){ if(auValid())pull(true); };
  return {start:start,stop:stop,pull:pull};
})();

<style id="dbf-menu-v1-style">

  }
  function open(){ build(); scrim.classList.add('on'); dr.classList.add('on'); }
  function close(){ if(!dr) return; scrim.classList.remove('on'); dr.classList.remove('on'); }
  function place(){
    if(btn && btn.isConnected) return;
    btn=document.createElement('button'); btn.type='button'; btn.className='dbfm-btn'; btn.title='메뉴'; btn.setAttribute('aria-label','메뉴');
    btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
    btn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); open(); });
    document.body.appendChild(btn);
  }
  if(document.body) place(); else document.addEventListener('DOMContentLoaded', place);
})();
</script>
<script id="mat-new-version-popup">
/* v3 · 새 버전 알림 팝업 (매출분석도구와 같은 모양)
   GitHub 주소로 연 창은 20초 뒤 한 번, 그다음 5분마다, 그리고 창으로 돌아올 때 새 버전이 있는지 확인함.
   새 버전이 있으면 화면 가운데 «새 버전 있음» 카드를 띄움 → «새로고침» 누르면 새 버전으로 열림, «나중에»는 닫기(같은 버전은 다시 안 띄움). */
(function(){
'use strict';
var HERE=String(MAT_VER||''), busy=false, shownFor='';
function bn(v){ return +(String(v||'').replace(/\D/g,''))||0; }
function onPages(){ try{ return location.protocol==='https:'&&/\.github\.io$/i.test(location.hostname); }catch(_e){ return false; } }
function pop(ver){
  var b=document.getElementById('newVerPopMat');
  if(!b){ b=document.createElement('div'); b.id='newVerPopMat';
    b.style.cssText='position:fixed;inset:0;z-index:2147483000;background:rgba(15,23,42,.28);display:flex;align-items:center;justify-content:center;padding:16px';
    document.body.appendChild(b); }
  b.style.display='flex';
  b.innerHTML='<div style="background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(15,23,42,.25);width:300px;max-width:100%;padding:26px 24px 20px;text-align:center;font-family:inherit">'
    +'<div style="font-size:30px;line-height:1">🔄</div>'
    +'<div style="margin-top:12px;font-size:17px;font-weight:800;color:#0f172a">새 버전 있음</div>'
    +'<div style="margin-top:6px;font-size:13px;color:#64748b"><b style="color:#1d4ed8">'+ver+'</b> · 지금 화면 '+HERE+'</div>'
    +'<div style="margin-top:4px;font-size:12px;color:#94a3b8">새로고침하면 새 버전으로 열립니다</div>'
    +'<div style="display:flex;gap:8px;margin-top:18px">'
    +'<button type="button" data-k="later" style="flex:1;font:inherit;font-size:13px;font-weight:700;border:1px solid #cbd5e1;border-radius:9px;padding:9px 0;background:#fff;color:#475569;cursor:pointer">나중에</button>'
    +'<button type="button" data-k="go" style="flex:1;font:inherit;font-size:13px;font-weight:800;border:0;border-radius:9px;padding:9px 0;background:#1e3a5f;color:#fff;cursor:pointer">새로고침</button>'
    +'</div></div>';
  b.querySelector('[data-k="go"]').onclick=function(){ location.reload(); };
  b.querySelector('[data-k="later"]').onclick=function(){ b.style.display='none'; };
}
window.matShowNewVerPop=pop;
function check(){
  if(!onPages()||busy)return; busy=true;
  fetch(location.origin+location.pathname+'?_v='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.text():''; }).then(function(t){
    var m=t&&t.match(/var MAT_VER='([^']+)'/), there=m?m[1]:'';
    if(!there||bn(there)<=bn(HERE)||shownFor===there)return;
    shownFor=there; pop(there);
  }).catch(function(){}).then(function(){ busy=false; });
}
if(onPages()){
  setTimeout(check,20000);
  setInterval(check,5*60*1000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible')setTimeout(check,1500); });
}
})();
</script>
</body>
